name: Deploy Flutter web to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build app web
        run: flutter build web --release --base-href /

      - name: Build landing web
        run: flutter build web --release -t lib/landing_main.dart --base-href /Landing_page/ --output build/landing_web

      - name: Package landing site
        run: |
          mkdir -p build/web/Landing_page
          cp -R build/landing_web/* build/web/Landing_page/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }} # Optional; used for commenting on PRs
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }} # JSON service account
          projectId: class-care
