<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B23A3A">
  <meta name="description" content="ClassCare landing page">
  <title>ClassCare</title>
  <style>
    :root {
      --bg: #fff9f8;
      --card: rgba(255, 255, 255, 0.72);
      --text: #241f1f;
      --muted: #6c5f5f;
      --brand: #b23a3a;
      --brand-dark: #8f2e2e;
      --border: rgba(178, 58, 58, 0.16);
      --shadow: 0 18px 50px rgba(70, 28, 28, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(178, 58, 58, 0.10), transparent 30%),
        radial-gradient(circle at bottom left, rgba(178, 58, 58, 0.06), transparent 24%),
        var(--bg);
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .hero {
      width: min(1120px, 100%);
      border-radius: 28px;
      padding: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.78), rgba(255,248,248,0.90));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(178, 58, 58, 0.10);
      color: var(--brand-dark);
      font-weight: 700;
      font-size: 13px;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      max-width: 56ch;
    }
    .grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .pill {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(178, 58, 58, 0.12);
      font-weight: 700;
      color: #4a3737;
      text-align: center;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      min-height: 56px;
      padding: 0 22px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 800;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      box-shadow: 0 16px 30px rgba(178, 58, 58, 0.28);
    }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.72);
      color: var(--brand-dark);
      border: 1px solid rgba(178, 58, 58, 0.14);
    }
    .glass {
      position: absolute;
      border-radius: 999px;
      background: rgba(178, 58, 58, 0.08);
      filter: blur(0.2px);
    }
    .g1 { width: 180px; height: 180px; top: -54px; right: -54px; }
    .g2 { width: 140px; height: 140px; bottom: -46px; left: -36px; }
    @media (max-width: 760px) {
      .hero { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="hero">
      <div class="glass g1"></div>
      <div class="glass g2"></div>
      <div class="badge">Anonymous by design</div>
      <h1>Report issues without revealing who you are.</h1>
      <p>Submit a report, check its status, and follow live moderation activity from one place.</p>
      <div class="grid" aria-label="features">
        <div class="pill">Anonymous</div>
        <div class="pill">Verified</div>
        <div class="pill">Live Status</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="/" rel="noopener">Enter App</a>
        <a class="btn secondary" href="/Landing_page/" rel="noopener">Stay on Landing</a>
      </div>
    </main>
  </div>
</body>
</html>
